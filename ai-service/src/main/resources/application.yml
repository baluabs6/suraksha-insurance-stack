server:
  port: ${PORT:8082}

spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/suraksha}
    username: ${SPRING_DATASOURCE_USERNAME:suraksha}
    password: ${SPRING_DATASOURCE_PASSWORD:suraksha_pw}
  jpa:
    hibernate:
      ddl-auto: none   # reads/updates tables owned by backend — same pattern as fraud-detection-service
    open-in-view: false
  ai:
    # Spring AI's Anthropic auto-configuration insists on a non-empty key at
    # startup. The placeholder is never sent anywhere: AnthropicClient checks
    # the separate anthropic.api-key below and returns its canned fallback
    # when no real key is configured, exactly as before.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
          max-tokens: 700
    chat:
      memory:
        repository:
          jdbc:
            # Creates the SPRING_AI_CHAT_MEMORY table on first start so support-chat
            # history is shared across ai-service replicas and survives restarts.
            initialize-schema: always
  # Kafka is no longer used — see ClaimFlaggedController, which replaced the
  # old @KafkaListener with a direct HTTP endpoint that fraud-detection-service calls.

fraud:
  # Mirrors fraud-detection-service's thresholds exactly — see the comment on
  # FraudSignalExplainer for why this is a separate copy. Keep these two in
  # sync if you tune fraud-detection-service's values.
  amount-to-coverage-threshold: ${FRAUD_AMOUNT_TO_COVERAGE_THRESHOLD:0.5}
  open-claims-threshold: ${FRAUD_OPEN_CLAIMS_THRESHOLD:2}

app:
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:5173}
  jwt:
    # Must match backend's app.jwt.secret exactly — ai-service only verifies
    # tokens backend issues, it never issues its own.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-production-32chars-min}
  # Shared secret for service-to-service calls (fraud-detection-service ->
  # ai-service /internal/**). Must match INTERNAL_SERVICE_TOKEN set on
  # fraud-detection-service.
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:dev-only-internal-token-change-me-before-production}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ai-service

ai:
  limits:
    # Per signed-in user, per replica. Raise or lower to fit your AI budget.
    requests-per-minute: ${AI_REQUESTS_PER_MINUTE:20}
    requests-per-day: ${AI_REQUESTS_PER_DAY:200}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  # If api-key is blank, every AI feature below falls back to a canned,
  # clearly-labeled response instead of failing — so the whole stack still
  # runs and demos end-to-end without anyone needing an API key on day one.
