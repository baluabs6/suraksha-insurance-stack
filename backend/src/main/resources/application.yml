server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/suraksha}
    username: ${SPRING_DATASOURCE_USERNAME:suraksha}
    password: ${SPRING_DATASOURCE_PASSWORD:suraksha_pw}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  kafka:
    # Kafka is no longer used — see ClaimEventPublisher, which now calls
    # fraud-detection-service directly over HTTP. Block left commented out
    # (rather than deleted) so re-enabling Kafka later is a quick diff if
    # you move to a platform with managed Kafka.
    # bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

fraud:
  service:
    base-url: ${FRAUD_SERVICE_URL:http://localhost:8081}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-production-32chars-min}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:5173}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  # If key-id/key-secret are blank, payments fall back to instant-mock mode —
  # see PaymentController. If webhook-secret is blank, the webhook endpoint
  # rejects every call (fails closed, not open) since there'd be nothing to
  # verify the signature against.

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: backend
