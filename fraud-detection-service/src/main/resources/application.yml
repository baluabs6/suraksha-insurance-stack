server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/suraksha}
    username: ${SPRING_DATASOURCE_USERNAME:suraksha}
    password: ${SPRING_DATASOURCE_PASSWORD:suraksha_pw}
  jpa:
    hibernate:
      ddl-auto: none   # this service only reads/updates existing tables owned by backend
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detection-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.suraksha.fraud.events,com.suraksha.backend.claims.events"
        spring.json.value.default.type: com.suraksha.fraud.events.ClaimSubmittedEvent
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

fraud:
  model-version: v1.0.0
  # Flag a claim if it exceeds this fraction of the policy's total coverage.
  amount-to-coverage-threshold: 0.5
  # Flag a claim if the same policy already has this many open (non-settled) claims.
  open-claims-threshold: 2
