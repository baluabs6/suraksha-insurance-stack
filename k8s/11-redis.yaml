# Demo-only in-cluster Redis. Prefer a managed equivalent (ElastiCache/
# MemoryStore) in production, as noted in the architecture doc.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: suraksha
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: suraksha
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
