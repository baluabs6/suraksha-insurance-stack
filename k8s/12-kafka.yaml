# Demo-only single-node Kafka (KRaft mode). For production, use a managed
# equivalent (MSK/Confluent Cloud) — operating a real Kafka cluster's storage
# and replication yourself is a significant undertaking on its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: suraksha
spec:
  replicas: 1
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      containers:
        - name: kafka
          image: bitnami/kafka:3.7
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_CFG_NODE_ID, value: "0" }
            - { name: KAFKA_CFG_PROCESS_ROLES, value: "controller,broker" }
            - { name: KAFKA_CFG_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CFG_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS, value: "0@kafka:9093" }
            - { name: ALLOW_PLAINTEXT_LISTENER, value: "yes" }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: suraksha
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
