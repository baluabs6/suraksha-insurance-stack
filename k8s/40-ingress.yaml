apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suraksha-ingress
  namespace: suraksha
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["suraksha.example.com", "api.suraksha.example.com", "ai.suraksha.example.com"]
      secretName: suraksha-tls
  rules:
    - host: suraksha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
    - host: api.suraksha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 80 } } }
    - host: ai.suraksha.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ai-service, port: { number: 80 } } }
