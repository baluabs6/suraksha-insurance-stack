version: "3.8"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: suraksha
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: suraksha_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suraksha
      SPRING_DATASOURCE_USERNAME: suraksha
      SPRING_DATASOURCE_PASSWORD: suraksha_pw
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      FRAUD_SERVICE_URL: http://fraud-detection-service:8081
      JWT_SECRET: change-this-to-a-long-random-value-before-production
      APP_CORS_ORIGIN: http://localhost:5173
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fraud-detection-service:
    build: ./fraud-detection-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suraksha
      SPRING_DATASOURCE_USERNAME: suraksha
      SPRING_DATASOURCE_PASSWORD: suraksha_pw
      AI_SERVICE_URL: http://ai-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  ai-service:
    build: ./ai-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/suraksha
      SPRING_DATASOURCE_USERNAME: suraksha
      SPRING_DATASOURCE_PASSWORD: suraksha_pw
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_AI_API_BASE_URL: http://localhost:8082
    ports:
      - "5173:80"
    depends_on:
      - backend
      - ai-service

volumes:
  pgdata:
