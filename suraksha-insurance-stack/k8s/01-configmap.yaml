apiVersion: v1
kind: ConfigMap
metadata:
  name: suraksha-config
  namespace: suraksha
data:
  APP_CORS_ORIGIN: "https://suraksha.example.com"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/suraksha"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"
  ANTHROPIC_MODEL: "claude-sonnet-5"
  VITE_API_BASE_URL: "https://api.suraksha.example.com"
  VITE_AI_API_BASE_URL: "https://ai.suraksha.example.com"
