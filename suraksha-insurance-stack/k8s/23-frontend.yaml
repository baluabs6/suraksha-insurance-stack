apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: suraksha
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: suraksha/frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "200m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: suraksha
spec:
  selector: { app: frontend }
  ports: [{ port: 80, targetPort: 80 }]
