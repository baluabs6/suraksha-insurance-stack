# Deny-by-default, then explicitly allow what the architecture doc calls for:
# only the ingress can reach backend/ai-service/frontend directly, and only
# backend/fraud-detection-service/ai-service can reach Postgres. Redis is
# reachable only from backend (session/refresh-token storage).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: suraksha
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend-and-apis
  namespace: suraksha
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [frontend, backend, ai-service] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {} # tighten to your ingress controller's namespace in production
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  namespace: suraksha
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, fraud-detection-service, ai-service] }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-redis
  namespace: suraksha
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: ["Ingress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: backend } } }]
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-kafka
  namespace: suraksha
spec:
  podSelector:
    matchLabels: { app: kafka }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, fraud-detection-service, ai-service] }
      ports: [{ protocol: TCP, port: 9092 }]
