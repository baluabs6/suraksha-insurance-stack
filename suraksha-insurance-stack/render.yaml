databases:
  - name: suraksha-postgres
    plan: free            # 1GB, expires 30 days after creation — switch to a paid plan before then

services:
  # --- backend (Spring Boot, public API) --------------------------------------
  - type: web
    name: suraksha-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free              # spins down after 15 min idle
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: suraksha-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: suraksha-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: suraksha-postgres
          property: password
      - key: SPRING_REDIS_HOST
        fromService:
          type: keyvalue
          name: suraksha-redis
          property: host
      - key: SPRING_REDIS_PORT
        fromService:
          type: keyvalue
          name: suraksha-redis
          property: port
      - key: FRAUD_SERVICE_URL
        fromService:
          type: web
          name: suraksha-fraud-detection
          property: hostport   # resolves to the service's onrender.com host — see note below
      - key: JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGIN
        value: https://suraksha-frontend.onrender.com   # confirm this matches the frontend's actual onrender.com URL after first deploy
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # --- fraud-detection-service (was a Kafka consumer, now a plain web service) ---
  - type: web
    name: suraksha-fraud-detection
    runtime: docker
    dockerfilePath: ./fraud-detection-service/Dockerfile
    dockerContext: ./fraud-detection-service
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: suraksha-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: suraksha-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: suraksha-postgres
          property: password
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: suraksha-ai-service
          property: hostport

  # --- ai-service ---------------------------------------------------------
  - type: web
    name: suraksha-ai-service
    runtime: docker
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: suraksha-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: suraksha-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: suraksha-postgres
          property: password
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

  # --- frontend (static site — free, no spin-down) --------------------------
  - type: web
    name: suraksha-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://suraksha-backend.onrender.com   # confirm this matches backend's actual onrender.com URL, then trigger a manual redeploy — Vite bakes this in at build time
      - key: VITE_AI_API_BASE_URL
        value: https://suraksha-ai-service.onrender.com   # same — confirm and redeploy after first deploy
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Redis (Key Value) ----------------------------------------------------
  - type: keyvalue
    name: suraksha-redis
    plan: free       # 25MB, no persistence — fine for cache/session use, not durable state
    ipAllowList: []
